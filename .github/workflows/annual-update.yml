name: Annual update

on:
  workflow_dispatch:
    inputs:
      year:
        description: Annual configuration year
        required: true
        type: number
      data_revision:
        description: Full iBurn-Data commit id
        required: true
        type: string
      version_name:
        description: Optional assertion matching annual/<year>.json
        required: false
        type: string
      create_pr:
        description: Create or update annual-update/<year>
        required: true
        default: false
        type: boolean

concurrency:
  group: annual-update-${{ inputs.year }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Restricted annual update
    runs-on: ubuntu-24.04
    environment: annual-update
    timeout-minutes: 60
    env:
      ANNUAL_YEAR: ${{ inputs.year }}
      DATA_REVISION: ${{ inputs.data_revision }}
      VERSION_ASSERTION: ${{ inputs.version_name }}
      IBURN_UNLOCK_CODE: ${{ secrets.IBURN_UNLOCK_CODE }}
      IBURN_API_URL: ${{ secrets.IBURN_API_URL }}
      MAPBOX_API_KEY: ${{ secrets.MAPBOX_API_KEY }}

    steps:
      - name: Check out Android repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: false

      - name: Check out exact private data revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: iBurnApp/iBurn-Data-Private
          ref: ${{ inputs.data_revision }}
          token: ${{ secrets.IBURN_DATA_TOKEN }}
          path: .annual-data
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate, generate, and verify annual update
        run: |
          tools/annual-update.sh run \
            --year "$ANNUAL_YEAR" \
            --data-revision "$DATA_REVISION" \
            --version-name "$VERSION_ASSERTION" \
            --staged-data-dir .annual-data \
            --require-secret

      - name: Upload restricted verification artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: annual-update-${{ inputs.year }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/reports/annual-update/annual-manifest.json
            build/reports/annual-update/verification-report.json
            iBurn/src/main/assets/databases/*.db
            iBurn/build/outputs/apk/regular/debug/*.apk

      - name: Prepare non-restricted pull request inputs
        if: ${{ inputs.create_pr }}
        run: tools/annual-update.sh prepare-pr --year "$ANNUAL_YEAR"

      - name: Upload pull request handoff
        if: ${{ inputs.create_pr }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: annual-update-pr-${{ inputs.year }}
          if-no-files-found: error
          retention-days: 1
          path: build/reports/annual-update/pr-handoff/

  pull_request:
    name: Publish annual update pull request
    needs: validate
    if: ${{ inputs.create_pr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      ANNUAL_YEAR: ${{ inputs.year }}
      DATA_REVISION: ${{ inputs.data_revision }}

    steps:
      - name: Check out Android repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: false

      - name: Download non-restricted pull request inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: annual-update-pr-${{ inputs.year }}
          path: build/reports/annual-update/pr-handoff

      - name: Create or update annual update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/annual-update.sh publish-pr \
            --year "$ANNUAL_YEAR" \
            --data-revision "$DATA_REVISION" \
            --base "${{ github.event.repository.default_branch }}"
