import groovy.json.JsonSlurper
import groovy.json.JsonOutput
import java.time.OffsetDateTime
import java.time.ZoneId
import java.security.MessageDigest

buildscript {
    repositories {
        mavenCentral()

        dependencies {

            // Add the Crashlytics Gradle plugin
            classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.4'
            classpath "com.google.devtools.ksp:symbol-processing-gradle-plugin:2.1.0-1.0.29"
        }
        google()
    }
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'kotlin-parcelize'

repositories {
    mavenCentral()
}

def annualConfigFiles = file("$rootDir/annual").listFiles()
        ?.findAll { it.name ==~ /\d{4}\.json/ }
        ?.sort { it.name } ?: []
if (annualConfigFiles.isEmpty()) {
    throw new GradleException('No annual configuration found at annual/<year>.json')
}
def requestedAnnualConfig = providers.gradleProperty('annualConfig').orNull
def annualConfigFile = requestedAnnualConfig != null
        ? rootProject.file(requestedAnnualConfig)
        : annualConfigFiles.last()
if (!annualConfigFile.isFile() ||
        annualConfigFile.parentFile.canonicalFile != file("$rootDir/annual").canonicalFile ||
        !(annualConfigFile.name ==~ /\d{4}\.json/)) {
    throw new GradleException("annualConfig must select annual/<year>.json: ${annualConfigFile}")
}
def annualConfig = new JsonSlurper().parse(annualConfigFile)
def releaseSigningPropertyNames = [
        'storeFile', 'storePassword', 'keyAlias', 'keyPassword'
]
def configuredReleaseSigningProperties = releaseSigningPropertyNames.findAll {
    project.hasProperty(it)
}
def staffUnlockCode = providers.environmentVariable('IBURN_UNLOCK_CODE')
        .orElse(providers.gradleProperty('iburnUnlockCode'))
        .orElse('')
def iburnApiUrl = providers.environmentVariable('IBURN_API_URL')
        .orElse(providers.gradleProperty('iburnApiUrl'))
        .orElse('https://iburnapp.com/')
def mapboxApiKey = providers.environmentVariable('MAPBOX_API_KEY')
        .orElse(providers.gradleProperty('mapboxApiKey'))
        .orElse('')
def hasReleaseSigningConfig =
        configuredReleaseSigningProperties.size() == releaseSigningPropertyNames.size()
if (!configuredReleaseSigningProperties.isEmpty() && !hasReleaseSigningConfig) {
    def missing = releaseSigningPropertyNames - configuredReleaseSigningProperties
    throw new GradleException("Incomplete release signing configuration; missing ${missing}")
}
def requiredAnnualKeys = [
        'year', 'versionCode', 'versionName', 'locationEmbargo',
        'campAddressEmbargo', 'mockNow'
] as Set
def allowedAnnualKeys = requiredAnnualKeys + ['mockLocation']
if (!annualConfig.keySet().containsAll(requiredAnnualKeys) ||
        !allowedAnnualKeys.containsAll(annualConfig.keySet())) {
    def missing = requiredAnnualKeys - annualConfig.keySet()
    def unknown = annualConfig.keySet() - allowedAnnualKeys
    throw new GradleException("Invalid ${annualConfigFile}: missing keys ${missing}, unknown keys ${unknown}")
}

def mockLocation = annualConfig.mockLocation
if (mockLocation != null) {
    if (!(mockLocation instanceof Map) ||
            mockLocation.keySet() != (['latitude', 'longitude'] as Set)) {
        throw new GradleException('Annual mockLocation must contain only latitude and longitude')
    }
    if (!(mockLocation.latitude instanceof Number) || !(mockLocation.longitude instanceof Number)) {
        throw new GradleException('Annual mockLocation latitude and longitude must be numbers')
    }
    double mockLatitude = mockLocation.latitude.doubleValue()
    double mockLongitude = mockLocation.longitude.doubleValue()
    if (!Double.isFinite(mockLatitude) || mockLatitude < -90.0d || mockLatitude > 90.0d) {
        throw new GradleException('Annual mockLocation latitude must be between -90 and 90')
    }
    if (!Double.isFinite(mockLongitude) || mockLongitude < -180.0d || mockLongitude > 180.0d) {
        throw new GradleException('Annual mockLocation longitude must be between -180 and 180')
    }
}

def versionYear = annualConfig.year
if (!(versionYear instanceof Integer) || versionYear <= 0 || annualConfigFile.name != "${versionYear}.json") {
    throw new GradleException("Annual year must be a positive integer matching ${annualConfigFile.name}")
}
if (!(annualConfig.versionCode instanceof Integer) || annualConfig.versionCode <= 0) {
    throw new GradleException('Annual versionCode must be a positive integer')
}
if (!(annualConfig.versionName instanceof String) ||
        !(annualConfig.versionName ==~ /${versionYear}\.[1-9]\d*/)) {
    throw new GradleException("Annual versionName must match ${versionYear}.<release>")
}
def olderConfigs = annualConfigFiles.findAll { it != annualConfigFile }.collect {
    new JsonSlurper().parse(it)
}.findAll { it.year < versionYear }
if (!olderConfigs.isEmpty() &&
        annualConfig.versionCode <= olderConfigs.collect { it.versionCode }.max()) {
    throw new GradleException('Annual versionCode must increase from prior years')
}

def datesInfoFile = file("$rootDir/iBurn-Data/data/${versionYear}/APIData/APIData.bundle/dates_info.json")
if (!datesInfoFile.isFile()) {
    throw new GradleException("Missing event dates in iBurn-Data: ${datesInfoFile}")
}
def datesInfo = new JsonSlurper().parse(datesInfoFile)
if (!(datesInfo.rangeInfo instanceof Map) ||
        datesInfo.rangeInfo.keySet() != (['startDate', 'endDate'] as Set)) {
    throw new GradleException("${datesInfoFile} must contain only rangeInfo.startDate and rangeInfo.endDate")
}

def parseAnnualDate = { String field, Object value ->
    if (!(value instanceof String)) {
        throw new GradleException("Annual ${field} must be an ISO-8601 timestamp with an offset")
    }
    try {
        return OffsetDateTime.parse(value)
    } catch (Exception exception) {
        throw new GradleException("Annual ${field} must be an ISO-8601 timestamp with an offset: ${value}", exception)
    }
}
def eventStart = parseAnnualDate('eventStart', datesInfo.rangeInfo.startDate)
def eventEnd = parseAnnualDate('eventEnd', datesInfo.rangeInfo.endDate)
def locationEmbargo = annualConfig.locationEmbargo == 'eventStart'
        ? eventStart : parseAnnualDate('locationEmbargo', annualConfig.locationEmbargo)
def campAddressEmbargo = annualConfig.campAddressEmbargo == 'eventStartMinusOneWeek'
        ? eventStart.minusWeeks(1)
        : parseAnnualDate('campAddressEmbargo', annualConfig.campAddressEmbargo)
def mockNow = parseAnnualDate('mockNow', annualConfig.mockNow)
def hasMockLocation = mockLocation != null
def mockLatitude = hasMockLocation ? mockLocation.latitude.doubleValue() : 0.0d
def mockLongitude = hasMockLocation ? mockLocation.longitude.doubleValue() : 0.0d
def playaZone = ZoneId.of('America/Los_Angeles')
[
        eventStart: eventStart,
        eventEnd: eventEnd,
        locationEmbargo: locationEmbargo,
        campAddressEmbargo: campAddressEmbargo,
        mockNow: mockNow
].each { field, value ->
    if (value.offset != playaZone.rules.getOffset(value.toInstant())) {
        throw new GradleException("Annual ${field} offset does not match America/Los_Angeles")
    }
}
if (!eventEnd.isAfter(eventStart)) {
    throw new GradleException('Annual eventEnd must be after eventStart')
}
if (eventStart.year != versionYear || eventEnd.year != versionYear) {
    throw new GradleException("iBurn-Data event dates must be in ${versionYear}")
}
if (locationEmbargo.isAfter(eventEnd) || campAddressEmbargo.isAfter(eventEnd)) {
    throw new GradleException('Annual embargo dates must not be after eventEnd')
}
def annualDataRoot = file("$rootDir/iBurn-Data/data/${versionYear}")
def geocoderSource = file("$annualDataRoot/geocoder")
def mapSource = file("$annualDataRoot/Map/Map.bundle")
def mediaSource = file("$annualDataRoot/MediaFiles/MediaFiles.bundle")
def apiSource = file("$annualDataRoot/APIData/APIData.bundle")
def artMediaNames = new JsonSlurper().parse(file("$apiSource/art.json"))
        .findAll { it.uid && it.images }
        .collect { "${it.uid}.jpg" }
        .unique()
def contentDigest = { File root, Collection<File> files ->
    def digest = MessageDigest.getInstance('SHA-256')
    files.findAll { it.isFile() }.sort { root.toPath().relativize(it.toPath()).toString() }.each { input ->
        def relative = root.toPath().relativize(input.toPath()).toString().replace(File.separator, '/')
        digest.update(relative.getBytes('UTF-8'))
        digest.update((byte) 0)
        input.withInputStream { stream ->
            def buffer = new byte[64 * 1024]
            int read
            while ((read = stream.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
    }
    return digest.digest().encodeHex().toString()
}
def mapInputFiles = fileTree(mapSource) {
    include 'map.mbtiles', 'camp_outlines.geojson', 'camp_labels.geojson'
    include 'styles/*.json', 'glyphs/Open Sans Regular/**/*.pbf'
}.files
def apiInputFiles = ['art.json', 'camp.json', 'event.json', 'mv.json'].collect { file("$apiSource/$it") }
def mapContentDigest = contentDigest(mapSource, mapInputFiles)
def databaseInputFiles = apiInputFiles + [
        file("$geocoderSource/bundle.js"),
        file("$rootDir/tools/generate_playa_database.py")
]
def databaseContentDigest = contentDigest(rootDir, databaseInputFiles)
def mapCacheVersion = new BigInteger(mapContentDigest.substring(0, 15), 16).longValue()

ext.versionYear = versionYear
ext.bundledDatabaseName = "playaDatabase${versionYear}-${databaseContentDigest.substring(0, 12)}.db"

// Generate typed annual metadata for application code. Event start and end are
// sourced directly from the selected year's iBurn-Data dates_info.json.
def generatedSrcDir = "${buildDir}/generated/source/annualmetadata"
tasks.register('generateAnnualMetadata') {
    inputs.file annualConfigFile
    inputs.file datesInfoFile
    outputs.dir generatedSrcDir
    doLast {
        def packageDir = new File(generatedSrcDir, 'com/gaiagps/iburn')
        packageDir.mkdirs()
        def outFile = new File(packageDir, 'AnnualMetadata.kt')
        outFile.text = """
package com.gaiagps.iburn

object AnnualMetadata {
    const val YEAR = ${versionYear}
    const val EVENT_START_EPOCH_MILLIS = ${eventStart.toInstant().toEpochMilli()}L
    const val EVENT_END_EPOCH_MILLIS = ${eventEnd.toInstant().toEpochMilli()}L
    const val LOCATION_EMBARGO_EPOCH_MILLIS = ${locationEmbargo.toInstant().toEpochMilli()}L
    const val CAMP_ADDRESS_EMBARGO_EPOCH_MILLIS = ${campAddressEmbargo.toInstant().toEpochMilli()}L
    const val MOCK_NOW_EPOCH_MILLIS = ${mockNow.toInstant().toEpochMilli()}L
    const val HAS_MOCK_LOCATION = ${hasMockLocation}
    const val MOCK_LOCATION_LATITUDE = ${mockLatitude}
    const val MOCK_LOCATION_LONGITUDE = ${mockLongitude}
    const val MAP_CACHE_VERSION = ${mapCacheVersion}L
}
""".stripIndent().trim() + "\n"
    }
}

kotlin {
    // Use Java 21 for compilation
    jvmToolchain(21)
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}


android {
    sourceSets {
        main.java.srcDir(generatedSrcDir)
        androidTest.assets.srcDir("$projectDir/schemas")
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    defaultConfig {
        compileSdk 36
        minSdkVersion 23
        targetSdkVersion 36
        versionCode annualConfig.versionCode

        versionName annualConfig.versionName

        applicationId "com.iburnapp.iburn3"

        // Provide year-specific resources for use in XML
        resValue "string", "app_name", "iBurn $versionYear"
        resValue "string", "current_year", "$versionYear"
        buildConfigField "String", "BUNDLED_DATABASE_NAME", "\"${bundledDatabaseName}\""
        buildConfigField "String", "IBURN_UNLOCK_CODE",
                JsonOutput.toJson(staffUnlockCode.get())
        buildConfigField "String", "IBURN_API_URL",
                JsonOutput.toJson(iburnApiUrl.get())
        buildConfigField "String", "MAPBOX_API_KEY",
                JsonOutput.toJson(mapboxApiKey.get())

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        archivesBaseName = "iburn-$versionName-$versionCode"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation":
                                     "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        release {
            // We'll read release signingConfig's data from
            // gradle.properties in the project's root directory
        }
    }


    flavorDimensions "production"

    productFlavors {
        regular {
            buildConfigField "boolean", "MOCK", "false"
            dimension "production"
        }
        // Mock location and date data
        mock {
            buildConfigField "boolean", "MOCK", "true"
            dimension "production"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            signingConfig signingConfigs.release
            debuggable false
        }
        unsigned {
            minifyEnabled false
            signingConfig null
            debuggable false
        }
    }

    compileOptions {
        // Target Java 21 bytecode
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }
    namespace 'com.gaiagps.iburn'
}

// A full local build should not require production signing credentials. When
// they are unavailable, keep the explicit unsigned variants and omit only the
// signed release variants.
androidComponents {
    beforeVariants(selector().withBuildType('release')) { variantBuilder ->
        variantBuilder.enable = hasReleaseSigningConfig
    }
}

// Read Signing key from gradle.properties located in project root
