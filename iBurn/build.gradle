tasks.register('validateAnnualData') {
    group = 'annual update'
    description = 'Validates the selected iBurn-Data revision and annual source contract.'
    inputs.dir annualDataRoot
    doLast {
        def statusOutput = new ByteArrayOutputStream()
        exec {
            workingDir "$rootDir/iBurn-Data"
            commandLine 'git', 'status', '--porcelain', '--untracked-files=all',
                    '--', "data/${versionYear}"
            standardOutput = statusOutput
        }
        if (!statusOutput.toString('UTF-8').trim().isEmpty()) {
            throw new GradleException("iBurn-Data data/${versionYear} must be clean before annual synchronization")
        }
        def revisionOutput = new ByteArrayOutputStream()
        exec {
            workingDir "$rootDir/iBurn-Data"
            commandLine 'git', 'rev-parse', 'HEAD'
            standardOutput = revisionOutput
        }
        def actualRevision = revisionOutput.toString('UTF-8').trim()
        def expectedRevision = providers.gradleProperty('dataRevision').orNull
        if (expectedRevision != null && !(expectedRevision ==~ /[0-9a-f]{40}/)) {
            throw new GradleException('dataRevision must be a full 40-character commit id')
        }
        if (expectedRevision != null && actualRevision != expectedRevision) {
            throw new GradleException("iBurn-Data revision ${actualRevision} does not match ${expectedRevision}")
        }
        def requiredFiles = [
                file("$geocoderSource/bundle.js"), file("$mapSource/map.mbtiles"),
                file("$mapSource/styles/iburn-light.json"), file("$mapSource/styles/iburn-dark.json"),
                file("$mapSource/camp_outlines.geojson"), file("$mapSource/camp_labels.geojson"),
                file("$apiSource/art.json"), file("$apiSource/camp.json"), file("$apiSource/event.json"),
                file("$apiSource/mv.json"),
                datesInfoFile
        ]
        def missing = requiredFiles.findAll { !it.isFile() }
        if (!file("$mapSource/glyphs/Open Sans Regular").isDirectory()) {
            missing.add(file("$mapSource/glyphs/Open Sans Regular"))
        }
        if (!mediaSource.isDirectory()) {
            missing.add(mediaSource)
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing annual data inputs: ${missing.join(', ')}")
        }
        ['art.json', 'camp.json', 'event.json', 'mv.json'].each { name ->
            def records = new JsonSlurper().parse(file("$apiSource/$name"))
            if (!(records instanceof List) || records.any { !(it instanceof Map) || !it.uid }) {
                throw new GradleException("${name} must be an array of records with non-empty uid values")
            }
            records.groupBy { it.uid }.each { uid, matches ->
                def canonical = matches.collect { JsonOutput.toJson(it) }.unique()
                if (canonical.size() > 1) {
                    throw new GradleException("${name} contains conflicting records for one uid")
                }
            }
        }
    }
}

tasks.register('syncGeocoder', Sync) {
    group = 'annual update'
    dependsOn 'validateAnnualData'
    from(geocoderSource) { include 'bundle.js' }
    into "$projectDir/src/main/assets/js"
}

tasks.register('syncMap', Sync) {
    group = 'annual update'
    dependsOn 'validateAnnualData'
    from(mapSource) {
        include 'map.mbtiles', 'camp_outlines.geojson', 'camp_labels.geojson'
        include 'styles/iburn-light.json', 'styles/iburn-dark.json'
        include 'glyphs/Open Sans Regular/**/*.pbf'
        eachFile { details ->
            details.path = details.path
                    .replaceFirst('^styles/', '')
                    .replaceFirst('^glyphs/Open Sans Regular/', 'glyphs/')
        }
        includeEmptyDirs = false
        filesMatching('**/iburn-*.json') {
            filter { line ->
                line.replaceAll('asset://Map', 'asset://map')
                        .replaceAll(/asset:\/\/iBurnData_iBurn\d{4}Map\.bundle\/Map\.bundle\/glyphs\/\{fontstack\}\/\{range\}\.pbf/, 'asset://map/glyphs/{range}.pbf')
                        .replaceAll(/asset:\/\/iBurnData_iBurn\d{4}Map\.bundle\/Map\.bundle\/(camp_(?:outlines|labels)\.geojson)/, 'asset://map/$1')
            }
            filter { line ->
                line.contains('"composite": {"url": "mbtiles://{{mbtiles_path}}", "type": "vector"') ? null : line
            }
        }
    }
    into "$projectDir/src/main/assets/map"
    doLast {
        fileTree(destinationDir) { include '*.json' }.files.each { style ->
            def text = style.getText('UTF-8')
            new JsonSlurper().parse(style)
            if (text.contains('iBurnData_iBurn') || text.contains('{{mbtiles_path}}')) {
                throw new GradleException("Unresolved annual map reference in ${style}")
            }
        }
    }
}

tasks.register('syncMedia', Sync) {
    group = 'annual update'
    dependsOn 'validateAnnualData'
    from(mediaSource) { include artMediaNames }
    into "$projectDir/src/main/assets/art_images"
}

tasks.register('syncAudioTour', Sync) {
    group = 'annual update'
    dependsOn 'validateAnnualData'
    from(mediaSource) { include '*.m4a' }
    into "$projectDir/src/main/assets/audio_tour"
}

tasks.register('syncApiJson', Sync) {
    group = 'annual update'
    dependsOn 'validateAnnualData'
    from(apiSource) { include 'art.json', 'camp.json', 'event.json', 'mv.json' }
    into "$projectDir/src/main/assets/json"
}

tasks.register('syncAnnualData') {
    group = 'annual update'
    description = 'Synchronizes all annual assets and deletes stale outputs.'
    dependsOn 'syncGeocoder', 'syncMap', 'syncMedia', 'syncAudioTour', 'syncApiJson'
}

tasks.register('updateData') {
    group = 'annual update'
    description = 'Deprecated alias for syncAnnualData; the submodule is never moved.'
    dependsOn 'syncAnnualData'
}

def generatedDatabaseFile = file(
        "$buildDir/generated/annual/database/${bundledDatabaseName}"
)
tasks.register('generateBundledDatabase', Exec) {
    group = 'annual update'
    description = 'Generates the bundled playa database on the host.'
    dependsOn 'validateAnnualData'
    inputs.files databaseInputFiles
    inputs.file "$rootDir/tools/generate_playa_database.py"
    outputs.file generatedDatabaseFile
    commandLine 'python3', "$rootDir/tools/generate_playa_database.py",
            '--api-root', apiSource,
            '--geocoder', file("$geocoderSource/bundle.js"),
            '--output', generatedDatabaseFile
}

tasks.register('syncBundledDatabase', Sync) {
    group = 'annual update'
    description = 'Installs only the current content-addressed bundled database.'
    dependsOn 'generateBundledDatabase'
    from generatedDatabaseFile
    into "$projectDir/src/main/assets/databases"
}

tasks.register('annualUpdate') {
    group = 'annual update'
    description = 'Synchronizes annual assets and generates the bundled database.'
    dependsOn 'syncAnnualData', 'syncBundledDatabase', 'generateAnnualMetadata'
}

tasks.register('bootstrapDatabase') {
    // Install the debug build, trigger DB bootstrap, and pull the resulting file.
    dependsOn(tasks.named('installRegularDebug'))
    doLast {
        def adb = file("${android.sdkDirectory}/platform-tools/adb").absolutePath
        def pkg = "com.iburnapp.iburn3.debug"
        def databaseName = project.ext.bundledDatabaseName
        def bootstrapName = "bootstrap"

        // Ensure the app is fully installed
        exec {
            commandLine adb, 'shell', 'sleep', '1'
        }

        println("Broadcasting bootstrap intent to ${pkg} with name ${bootstrapName}")
        exec {
            commandLine adb, 'shell', 'am', 'broadcast', '-a',
                    'com.gaiagps.iburn.BOOTSTRAP_DB', '--es',
                    'com.gaiagps.iburn.EXTRA_DB_NAME', bootstrapName,
                    '-n', "${pkg}/com.gaiagps.iburn.DatabaseBootstrapReceiver"
        }

        def outFile = file("$buildDir/reports/annual-update/device/${databaseName}")
        outFile.parentFile.mkdirs()
        exec {
            commandLine adb, 'exec-out', 'run-as', pkg,
                    'cat', "/data/data/${pkg}/databases/${bootstrapName}"
            standardOutput = new FileOutputStream(outFile)
        }
        println("Database bootstrap complete. Output written to ${outFile.absolutePath} (${outFile.length()} bytes)")
    }
}

tasks.register('verifyDeviceDatabaseParity', Exec) {
    group = 'verification'
    description = 'Compares host and device-generated read-only database tables.'
    dependsOn 'bootstrapDatabase'
    def deviceDatabase = file(
            "$buildDir/reports/annual-update/device/${bundledDatabaseName}"
    )
    def parityReport = file(
            "$rootProject.buildDir/reports/annual-update/device-parity-report.json"
    )
    inputs.file generatedDatabaseFile
    inputs.file deviceDatabase
    inputs.file "$rootDir/tools/compare_database_parity.py"
    outputs.file parityReport
    outputs.upToDateWhen { false }
    commandLine 'python3', "$rootDir/tools/compare_database_parity.py",
            '--host', generatedDatabaseFile,
            '--device', deviceDatabase,
            '--output', parityReport
}

tasks.register('generateAnnualBaselineManifest', Exec) {
    group = 'annual update'
    description = 'Inventories current annual assets for migration baselines.'

    def outputPath = providers.gradleProperty('annualManifestOutput')
            .orElse("${rootProject.layout.buildDirectory.get()}/reports/annual-update/${versionYear}.json")
    def outputFile = file(outputPath.get())

    inputs.dir("$projectDir/src/main/assets")
    inputs.file("$rootDir/tools/annual_manifest.py")
    inputs.property('year', versionYear)
    outputs.file(outputFile)
    // The manifest records the submodule commit, which is intentionally not a
    // Gradle file input. Always regenerate so that revision cannot become stale.
    outputs.upToDateWhen { false }

    commandLine 'python3', "$rootDir/tools/annual_manifest.py",
            '--repo-root', rootDir,
            '--year', versionYear.toString(),
            '--annual-config', annualConfigFile,
            '--output', outputFile
}

def annualReportDir = file("$rootProject.buildDir/reports/annual-update")
def annualManifestFile = file("$annualReportDir/annual-manifest.json")
def annualVerificationFile = file("$annualReportDir/verification-report.json")
def dataRevisionOutput = new ByteArrayOutputStream()
exec {
    workingDir "$rootDir/iBurn-Data"
    commandLine 'git', 'rev-parse', 'HEAD'
    standardOutput = dataRevisionOutput
}
def selectedDataRevision = dataRevisionOutput.toString('UTF-8').trim()

tasks.register('generateAnnualManifest', Exec) {
    group = 'annual update'
    description = 'Generates the deterministic annual asset manifest.'
    dependsOn 'syncAnnualData', 'syncBundledDatabase'
    inputs.dir "$projectDir/src/main/assets"
    inputs.file annualConfigFile
    inputs.file "$rootDir/tools/annual_manifest.py"
    inputs.property 'dataRevision', selectedDataRevision
    outputs.file annualManifestFile
    outputs.upToDateWhen { false }
    commandLine 'python3', "$rootDir/tools/annual_manifest.py",
            '--repo-root', rootDir,
            '--year', versionYear.toString(),
            '--data-revision', selectedDataRevision,
            '--annual-config', annualConfigFile,
            '--output', annualManifestFile
}

tasks.named('annualUpdate') {
    dependsOn 'generateAnnualManifest'
}

tasks.register('testAnnualTools', Exec) {
    group = 'verification'
    description = 'Runs host-side annual automation unit tests.'
    commandLine 'python3', '-m', 'unittest', 'discover',
            '-s', "$rootDir/tools", '-p', 'test_*.py'
}

tasks.register('verifyAnnualOutputs', Exec) {
    group = 'verification'
    description = 'Validates annual JSON, database, MBTiles, styles, media, and secrecy.'
    dependsOn 'annualUpdate', 'testAnnualTools'
    inputs.dir "$projectDir/src/main/assets"
    inputs.file annualConfigFile
    inputs.file annualManifestFile
    inputs.file "$rootDir/tools/verify_annual_update.py"
    outputs.file annualVerificationFile
    outputs.upToDateWhen { false }
    commandLine 'python3', "$rootDir/tools/verify_annual_update.py",
            '--repo-root', rootDir,
            '--annual-config', annualConfigFile,
            '--data-revision', selectedDataRevision,
            '--database', file("$projectDir/src/main/assets/databases/${bundledDatabaseName}"),
            '--manifest', annualManifestFile,
            '--report', annualVerificationFile
}

tasks.register('verifyAnnualUpdate') {
    group = 'verification'
    description = 'Runs all host-side annual update validation gates.'
    dependsOn 'verifyAnnualOutputs', 'testRegularDebugUnitTest',
            'lint', 'assembleRegularDebug'
}

tasks.register('validateAnnualSecret') {
    group = 'verification'
    description = 'Checks that the restricted staff unlock code is available without printing it.'
    doLast {
        def unlockCode = providers.environmentVariable('IBURN_UNLOCK_CODE')
                .orElse(providers.gradleProperty('iburnUnlockCode')).orNull
        if (unlockCode == null || unlockCode.trim().isEmpty()) {
            throw new GradleException(
                    'Set IBURN_UNLOCK_CODE or local Gradle property iburnUnlockCode'
            )
        }
    }
}

// Ensure generated source is available before compiling
tasks.named('preBuild') {
    dependsOn(generateAnnualMetadata)
}

// When synchronization and Android packaging share one task graph (as they do
// under verifyAnnualUpdate), packaging must observe the completed Sync outputs.
// mustRunAfter does not make ordinary builds require private annual data.
def annualAssetProducerTasks = [
        'syncApiJson', 'syncAudioTour', 'syncGeocoder', 'syncMap', 'syncMedia',
        'syncBundledDatabase'
]
tasks.matching {
    it.name ==~ /merge.*Assets/ || it.name.toLowerCase().contains('lint')
}.configureEach {
    mustRunAfter annualAssetProducerTasks
}
